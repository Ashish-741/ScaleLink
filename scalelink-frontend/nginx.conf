server {
    listen 80;
    
    # Where the static files are stored
    root /usr/share/nginx/html;
    index index.html;
    
    # Any route that doesn't match a file gets redirected to index.html
    # This is CRITICAL for React Router to work without giving 404 errors on refresh!
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Optional: Cache static assets for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
