# ============================================================
# ScaleLink - Development Profile Configuration
# ============================================================
# Activated with: --spring.profiles.active=dev
# Overrides values from application.yml for local development.
# ============================================================

spring:
  jpa:
    properties:
      hibernate:
        show_sql: true           # Show SQL in dev for debugging
        format_sql: true         # Pretty-print SQL

logging:
  level:
    com.scalelink: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
